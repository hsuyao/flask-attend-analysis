<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>出勤結果</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function updateTable() {
            var weekIdx = document.getElementById('weekSelector').value;
            $.ajax({
                url: '/get_week_data/' + weekIdx,
                type: 'GET',
                success: function(response) {
                    if (response.attendance_table) {
                        $('#attendanceTable').html(response.attendance_table);
                        console.log('出勤表格更新成功');
                    } else {
                        console.error('回應中無 attendance_table:', response);
                    }
                    if (response.stats_table) {
                        $('#statsTable').html(response.stats_table);
                        console.log('統計表格更新成功');
                    } else {
                        console.error('回應中無 stats_table:', response);
                    }
                },
                error: function(xhr, status, error) {
                    console.error('AJAX 錯誤:', status, error);
                }
            });
        }

        $(document).ready(function() {
            $('#weekSelector').on('change', updateTable);
            updateTable();
        });
    </script>
</head>
<body>
    <div class="table-container">
        <div class="week-selector-container">
            <select id="weekSelector" class="week-selector">
                {% for week_name, idx in week_options %}
                    <option value="{{ idx }}" {% if idx == selected_week_idx %}selected{% endif %}>
                        {{ week_name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div id="attendanceTable">
            {{ attendance_table_html | safe }}
        </div>
        <div id="statsTable">
            {{ stats_table_html | safe }}
        </div>
    </div>
    <div class="button-container">
        {% if has_file_stream %}
            <a href="{{ url_for('download_file') }}" class="button">下載處理後的檔案</a>
        {% endif %}
        <a href="{{ url_for('index') }}" class="button">返回上傳頁面</a>
    </div>
    <footer style="text-align: center; margin-top: 20px;">
        <p>版本: {{ version }}</p>
    </footer>

</html>
