<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>資料庫管理</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<style>
.table-container{overflow-x:auto}
.filter-row .form-control{min-width:160px}
</style>
</head>
<body>
<div class="container">
  <h2>資料庫管理 (Admin)</h2>

  <!-- Import / Export -->
  <div class="mb-3">
    <input id="importFile" type="file" accept=".csv">
    <button class="button" onclick="importCSV()">匯入</button>
    <a class="button" href="/admin/export">匯出 CSV</a>
  </div>

  <!-- Filters -->
  <div class="row filter-row mb-2">
    <div class="col-auto"><input id="nameKw"  class="form-control" placeholder="姓名關鍵字"></div>
    <div class="col-auto"><input id="startDt" type="date" class="form-control"></div>
    <div class="col-auto"><input id="endDt"   type="date" class="form-control"></div>
    <div class="col-auto">
      <select id="districtSel" class="form-control">
        <option value="">全部小區</option>
        {% for d in districts %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-auto">
      <select id="eventSel" class="form-control">
        <option value="">全部活動</option>
        {% for e in events %}<option value="{{ e }}">{{ e }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-auto">
      <button class="button" onclick="loadPage(1)">搜尋</button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-container">
    <table class="excel-table" id="dataTable">
      <thead>
        <tr>
          <th data-field="name">姓名</th>
          <th data-field="district">區</th>
          <th data-field="week_display">週次</th>
          <th data-field="event_name">活動</th>
          <th data-field="attended">到會</th>
          <th data-field="date">日期</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Pagination -->
  <nav><ul class="pagination" id="pager"></ul></nav>
</div>
<footer style="text-align:center;margin-top:20px;">版本: {{ version }}</footer>

<script>
let currentPage=1, perPage=20, sort="week_display", order=-1;

function filters(){
  return {
    page: currentPage,
    per_page: perPage,
    sort, order,
    name: $('#nameKw').val(),
    start: $('#startDt').val(),
    end: $('#endDt').val(),
    district: $('#districtSel').val(),
    event: $('#eventSel').val()
  };
}

function loadPage(p=1){
  currentPage=p;
  $.getJSON('/admin/data', filters(), renderTable)
       .fail(e=>alert('載入失敗: '+e.responseJSON?.error));
}

function renderTable(res){
  const tb=$('#dataTable tbody').empty();
  res.records.forEach(r=>{
    tb.append(`<tr>
      <td>${r.name}</td><td>${r.district}</td><td>${r.week_display}</td>
      <td>${r.event_name}</td><td>${r.attended}</td><td>${r.date}</td>
      <td><button class="btn btn-sm btn-danger" onclick="del('${r.id}')">刪除</button></td>
    </tr>`);
  });

  // pagination
  const pages=Math.ceil(res.total/perPage);
  const pg=$('#pager').empty();
  for(let i=1;i<=pages;i++){
    pg.append(`<li class="page-item ${i===currentPage?'active':''}">
       <a class="page-link" href="javascript:loadPage(${i})">${i}</a></li>`);
  }
}

function del(id){
  if(!confirm('確定刪除?')) return;
  $.ajax({url:'/admin/delete/'+id,type:'DELETE'})
     .done(()=>loadPage(currentPage))
     .fail(e=>alert('刪除失敗:'+e.responseJSON?.error));
}

function importCSV(){
  const f=$('#importFile')[0].files[0];
  if(!f){alert('請選檔');return;}
  const fd=new FormData();fd.append('file',f);
  $.ajax({url:'/admin/import',type:'POST',data:fd,
          contentType:false,processData:false})
    .done(r=>{alert('匯入 '+r.imported+' 筆');loadPage(1);})
    .fail(e=>alert('匯入失敗:'+e.responseJSON?.error));
}

// sort header click
$('#dataTable th[data-field]').on('click',function(){
  const f=$(this).data('field');
  if(sort===f){order*=-1;}else{sort=f;order=-1;}
  loadPage(1);
});

$(document).ready(()=>loadPage(1));
</script>
</body>
</html>
