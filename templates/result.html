<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>統計結果</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>統計結果</h2>
        <div class="table-container">
            <div class="week-selector-container">
                             <select id="weekSelector" class="week-selector">
                             {% for idx, week_name in week_options %}
                                     <option value="{{ idx }}"
                                                     {% if week_name == selected_week_display %}selected{% endif %}>
                                             {{ week_name }}
                                     </option>
                             {% endfor %}
                     </select>
            </div>
            <div id="attendanceTable">
                {{ attendance_table_html | safe }}
            </div>
        </div>
        <div class="button-container">
            {% if has_file_stream %}
                <a href="{{ url_for('download_file') }}" class="button">下載處理後的檔案</a>
            {% endif %}
            <a href="{{ url_for('index') }}" class="button">返回上傳頁面</a>
            {% if not is_anonymous %}
            <a href="{{ url_for('history') }}" class="button">查看歷史紀錄</a>
            {% endif %}
            <a href="{{ url_for('logout') }}" class="class button">登出</a>
        </div>
    </div>
    <footer style="text-align: center; margin-top: 20px;">
        <p>版本: {{ version }}</p>
    </footer>

    <script>
        function updateTable() {
                     const weekIdx = $('#weekSelector').val();
                     $.ajax({
                             url: '/get_week_data/' + weekIdx,
                             type: 'GET',
                             success: res => $('#attendanceTable').html(res.attendance_table || '<p>無資料</p>'),
                             error: () => $('#attendanceTable').html('<p>載入失敗</p>')
                     });
             }

        $(document).ready(()=>$('#weekSelector').on('change', updateTable));
    </script>
</body>
</html>
