<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>統計結果</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>統計結果</h2>
        <div class="table-container">
            <div class="week-selector-container">
                <select id="weekSelector" class="week-selector">
                    {% for week_name, idx in week_options %}
                        <option value="{{ idx }}" {% if idx == selected_week_idx %}selected{% endif %}>
                            {{ week_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div id="attendanceTable">
                {{ attendance_table_html | safe }}
            </div>
        </div>
        <div class="button-container">
            {% if has_file_stream %}
                <a href="{{ url_for('download_file') }}" class="button">下載處理後的檔案</a>
            {% endif %}
            <a href="{{ url_for('index') }}" class="button">返回上傳頁面</a>
        </div>
    </div>
    <footer style="text-align: center; margin-top: 20px;">
        <p>版本: {{ version }}</p>
    </footer>

    <script>
        function updateTable() {
            var weekIdx = document.getElementById('weekSelector').value;
            $.ajax({
                url: '/get_week_data/' + weekIdx,
                type: 'GET',
                success: function(response) {
                    if (response.attendance_table) {
                        $('#attendanceTable').html(response.attendance_table);
                        console.log('統計表格更新成功');
                    } else {
                        console.error('回應中無 attendance_table:', response);
                    }
                },
                error: function(xhr, status, error) {
                    console.error('AJAX 錯誤:', status, error);
                }
            });
        }

        $(document).ready(function() {
            $('#weekSelector').on('change', updateTable);
            const taskResult = sessionStorage.getItem('taskResult');
            if (taskResult) {
                const result = JSON.parse(taskResult);
                {% for key in ['latest_analytic_date', 'latest_attendance_data', 'latest_week_display', 'latest_district_counts', 'latest_main_district', 'latest_main_district_counts', 'all_attendance_data'] %}
                    sessionStorage.setItem('{{ key }}', JSON.stringify(result['{{ key }}']));
                {% endfor %}
                sessionStorage.removeItem('taskResult');
                updateTable();
            }
        });
    </script>
</body>
</html>
