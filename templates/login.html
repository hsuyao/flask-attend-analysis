<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>登入</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .button-container {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>登入系統</h2>
        {% if error %}
        <p style="color: red; text-align: center;">{{ error }}</p>
        {% endif %}
        <form id="loginForm" action="{{ url_for('login') }}" method="post" class="form-group">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">使用者名稱</label>
                <input type="text" name="username" id="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <div class="button-container">
                <button type="submit" class="button">登入</button>
                <button type="button" class="button" onclick="window.location.href='{{ url_for('anonymous_login') }}'">匿名登入</button>
                <button type="button" class="button" onclick="window.location.href='{{ url_for('register') }}'">註冊</button>
                <button type="button" class="button" onclick="window.location.href='{{ url_for('reset_password_route') }}'">忘記密碼</button>
            </div>
        </form>
    </div>
    <footer style="text-align: center; margin-top: 20px;">
        <p>版本: {{ version }}</p>
    </footer>
</body>
</html>
