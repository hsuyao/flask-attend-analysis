<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>使用者管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container upload-page">
  <h2>使用者管理</h2>
  <table class="excel-table" id="userTable">
    <thead>
      <tr>
        <th>使用者</th><th>信箱</th><th>角色</th><th>狀態</th><th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <a class="button" href="{{ url_for('admin_bp.admin_home') }}">返回資料管理</a>
  <a class="button" href="{{ url_for('index') }}">返回首頁</a>
</div>
<script>
function loadUsers(){
  $.getJSON('/admin/users/data', users=>{
    const tb=$('#userTable tbody').empty();
    users.forEach(u=>{
      tb.append(`<tr>
        <td>${u.username}</td>
        <td>${u.email}</td>
        <td>
          <select onchange="changeRole('${u.username}',this.value)">
            <option ${u.role==='user'?'selected':''} value="user">user</option>
            <option ${u.role==='admin'?'selected':''} value="admin">admin</option>
          </select>
        </td>
        <td>
          ${u.blocked
            ?'<button onclick="toggleBlock(\''+u.username+'\',false)">解封</button>'
            :'<button onclick="toggleBlock(\''+u.username+'\',true)">封鎖</button>'}
        </td>
        <td><button class="btn btn-sm btn-danger" onclick="delUser('${u.username}')">刪除</button></td>
      </tr>`);
    });
  });
}

function changeRole(user,role){
  $.ajax({url:'/admin/users/update_role',method:'POST',
          contentType:'application/json',
          data:JSON.stringify({username:user,role:role})})
    .done(()=>loadUsers());
}

function toggleBlock(user,block){
  const url = block?'/admin/users/block':'/admin/users/unblock';
  $.ajax({url:url,method:'POST',
          contentType:'application/json',
          data:JSON.stringify({username:user})})
    .done(()=>loadUsers());
}

function delUser(user){
  if(!confirm('刪除 '+user+'?'))return;
  $.ajax({url:'/admin/users/delete',method:'POST',
          contentType:'application/json',
          data:JSON.stringify({username:user})})
    .done(()=>loadUsers());
}

$(document).ready(()=>loadUsers());
</script>
</body>
</html>
