[supervisord]
nodaemon=true
logfile=/dev/null
loglevel=info

[program:gunicorn]
command=gunicorn --bind 0.0.0.0:5000 app:app
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
redirect_stderr=true
loglevel=info
maxbytes=0

[program:celery]
command=celery -A app.celery worker --loglevel=info
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
redirect_stderr=true
loglevel=info
maxbytes=0
