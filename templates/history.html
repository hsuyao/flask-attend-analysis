<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>週報表歷史紀錄</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>週報表歷史紀錄</h2>
        <div class="table-container">
            <div class="week-selector-container">
                <label for="districtSelector">選擇大區：</label>
                <select id="districtSelector" class="week-selector">
                    <option value="">請選擇大區</option>
                    {% for district in main_districts %}
                        <option value="{{ district }}">{{ district }}</option>
                    {% endfor %}
                </select>
                <label for="weekSelector" style="margin-left: 20px;">選擇週次：</label>
                <select id="weekSelector" class="week-selector" disabled>
                    <option value="">請先選擇大區</option>
                </select>
            </div>
            <div id="attendanceTable">
                <p>請選擇大區和週次以顯示數據</p>
            </div>
        </div>
        <div class="button-container">
            <a href="{{ url_for('index') }}" class="button">返回上傳頁面</a>
        </div>
    </div>
    <footer style="text-align: center; margin-top: 20px;">
        <p>版本: {{ version }}</p>
    </footer>

    <script>
        $(document).ready(function() {
            $('#districtSelector').on('change', function() {
                var district = $(this).val();
                $('#weekSelector').prop('disabled', true);
                $('#weekSelector').html('<option value="">正在載入週次...</option>');
                $('#attendanceTable').html('<p>正在載入數據...</p>');

                if (district) {
                    $.ajax({
                        url: '/get_weeks_for_district/' + encodeURIComponent(district),
                        type: 'GET',
                        success: function(response) {
                            if (response.weeks && response.weeks.length > 0) {
                                var options = '<option value="">請選擇週次</option>';
                                $.each(response.weeks, function(i, week) {
                                    options += '<option value="' + encodeURIComponent(week.date) + '">' + week.display + '</option>';
                                });
                                $('#weekSelector').html(options);
                                $('#weekSelector').prop('disabled', false);
                            } else {
                                $('#weekSelector').html('<option value="">無可用週次</option>');
                                $('#attendanceTable').html('<p>該大區無歷史數據</p>');
                            }
                        },
                        error: function(xhr) {
                            $('#weekSelector').html('<option value="">載入失敗</option>');
                            $('#attendanceTable').html('<p>無法載入週次數據：' + (xhr.responseJSON?.error || '伺服器錯誤') + '</p>');
                        }
                    });
                } else {
                    $('#weekSelector').html('<option value="">請先選擇大區</option>');
                    $('#attendanceTable').html('<p>請選擇大區和週次以顯示數據</p>');
                }
            });

            $('#weekSelector').on('change', function() {
                var district = $('#districtSelector').val();
                var weekDisplay = $(this).val();
                if (district && weekDisplay) {
                    $('#attendanceTable').html('<p>正在載入數據...</p>');
                    $.ajax({
                        url: '/get_history_data/' + encodeURIComponent(district) + '/' + weekDisplay,
                        type: 'GET',
                        success: function(response) {
                            if (response.attendance_table) {
                                $('#attendanceTable').html(response.attendance_table);
                                console.log('歷史數據表格更新成功');
                            } else {
                                $('#attendanceTable').html('<p>無可用數據</p>');
                            }
                        },
                        error: function(xhr) {
                            $('#attendanceTable').html('<p>無法載入數據：' + (xhr.responseJSON?.error || '伺服器錯誤') + '</p>');
                        }
                    });
                } else {
                    $('#attendanceTable').html('<p>請選擇大區和週次以顯示數據</p>');
                }
            });
        });
    </script>
</body>
</html>
