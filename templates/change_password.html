<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <title>變更密碼</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .login-container {max-width: 360px;margin: 50px auto;padding: 20px;background: #fff;border-radius: 8px;box-shadow: 0 0 10px rgba(0,0,0,0.1);}
        .form-group {margin-bottom: 15px;}
        .button-container {text-align: center;}
    </style>
</head>
<body>
    <div class="login-container">
        <h2>變更密碼</h2>
        {% if error %}
        <p style="color: red; text-align: center;">{{ error }}</p>
        {% elif success %}
        <p style="color: green; text-align: center;">{{ success }}</p>
        {% endif %}
        <form action="{{ url_for('change_password_route') }}" method="post" class="form-group">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="old_password">舊密碼</label>
                <input type="password" name="old_password" id="old_password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="new_password">新密碼</label>
                <input type="password" name="new_password" id="new_password" class="form-control" required>
            </div>
            <div class="button-container">
                <button type="submit" class="button">變更</button>
                <button type="button" class="button" onclick="window.location.href='{{ url_for('index') }}'">取消</button>
            </div>
        </form>
    </div>
    <footer style="text-align: center; margin-top: 20px;">
        <p>版本: {{ version }}</p>
    </footer>
</body>
</html>
