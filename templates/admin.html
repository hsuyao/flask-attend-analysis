<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>資料庫管理</title>
<meta name="csrf-token" content="{{ csrf_token() }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<style>
.table-container{overflow-x:auto}
.filter-row .form-control{min-width:160px}
</style>
</head>
<body>
<div class="container">
  <h2>資料庫管理 (Admin)</h2>
  <!-- 1. 檔案選擇 & 匯入 / 匯出 -->
  <div class="mb-3 d-flex align-items-center">
    <input id="importFile" type="file" accept=".csv" class="me-2">
    <button class="button me-2" onclick="importCSV()">匯入</button>
    <a class="button" href="/admin/export">匯出 CSV</a>
  </div>

  <!-- 2. 使用者管理 -->
  <div class="mb-3">
    <a class="button" href="{{ url_for('admin_bp.admin_users') }}">使用者管理</a>
  </div>
  <!-- 3. 資料庫狀態 -->
  <div id="dbStatus" class="alert alert-info py-2 px-3" role="alert">
    正在讀取資料庫狀態…
  </div>

  <!-- 4. 搜尋選項介面 + 執行搜尋 & 刪除選取 -->
  <div class="row filter-row mb-3 align-items-center">  
    <div class="col-auto"><input id="nameKw"  class="form-control" placeholder="姓名關鍵字"></div>
    <div class="col-auto"><input id="startDt" type="date" class="form-control"></div>
    <div class="col-auto"><input id="endDt"   type="date" class="form-control"></div>
    <div class="col-auto">
      <select id="districtSel" class="form-control">
        <option value="">全部小區</option>
        {% for d in districts %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-auto">
      <select id="eventSel" class="form-control">
        <option value="">全部活動</option>
        {% for e in events %}<option value="{{ e }}">{{ e }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-auto">
      <button class="button me-2" onclick="loadPage(1)">搜尋</button>
      <button class="button btn-danger" id="delSelBtn" onclick="deleteSelected()" disabled>刪除選取</button>
    </div>
  </div>
  <!-- Table -->
  <div class="table-container">
    <table class="excel-table" id="dataTable">
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAll"></th>
          <th data-field="name">姓名</th>
          <th data-field="district">區</th>
          <th data-field="week_display">週次</th>
          <th data-field="event_name">活動</th>
          <th data-field="attended">到會</th>
          <th data-field="date">日期</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <!-- 5. 資料庫內容 -->
  <!-- Pagination -->
  <nav><ul class="pagination" id="pager"></ul></nav>

  <!-- 6. 返回首頁 -->
  <div class="mt-3">
    <a class="button" href="{{ url_for('index') }}">返回首頁</a>
  </div>
</div>

<footer style="text-align:center;margin-top:20px;">版本: {{ version }}</footer>

<script>
const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
$.ajaxSetup({headers: {'X-CSRFToken': csrfToken}});
let currentPage=1, perPage=20, sort="week_display", order=-1;

function filters(){
  return {
    page: currentPage, per_page: perPage, sort, order,
    name: $('#nameKw').val(),
    start: $('#startDt').val(),
    end: $('#endDt').val(),
    district: $('#districtSel').val(),
    event: $('#eventSel').val()
  };
}

function loadPage(p=1){
  currentPage=p;
  $.getJSON('/admin/data', filters(), renderTable)
       .fail(e=>alert('載入失敗: '+e.responseJSON?.error));
  // 清掉全選與刪除按鈕狀態
  $('#selectAll').prop('checked', false);
  toggleDeleteBtn();
}

function renderTable(res){
  const tb=$('#dataTable tbody').empty();
  res.records.forEach(r=>{
    tb.append(`<tr>
      <td><input type="checkbox" class="row-chk" value="${r.id}"></td>
      <td>${r.name}</td><td>${r.district}</td><td>${r.week_display}</td>
      <td>${r.event_name}</td><td>${r.attended}</td><td>${r.date}</td>
      <td><button class="btn btn-sm btn-danger" onclick="del('${r.id}')">刪除</button></td>
    </tr>`);
  });

  // pagination
  const pages=Math.ceil(res.total/perPage);
  const pg=$('#pager').empty();
  for(let i=1;i<=pages;i++){
    pg.append(`<li class="page-item ${i===currentPage?'active':''}">
       <a class="page-link" href="javascript:loadPage(${i})">${i}</a></li>`);
  }

  // 綁定勾選事件
  $('.row-chk').on('change', toggleDeleteBtn);
}

function del(id){
  if(!confirm('確定刪除?')) return;
  $.ajax({url:'/admin/delete/'+id,type:'DELETE'})
     .done(()=>loadPage(currentPage))
     .fail(e=>alert('刪除失敗:'+e.responseJSON?.error));
}

// ------------ 批次刪除 ------------
function deleteSelected(){
  const ids=$('.row-chk:checked').map((_,el)=>el.value).get();
  if(ids.length===0) return;
  if(!confirm('確定刪除 '+ids.length+' 筆?')) return;
  $.ajax({url:'/admin/delete_batch',type:'POST',
          contentType:'application/json',
          data:JSON.stringify({ids})})
    .done(r=>{alert('已刪除 '+r.deleted+' 筆');loadPage(currentPage);})
    .fail(e=>alert('批次刪除失敗:'+e.responseJSON?.error));
}
// 全選
$('#selectAll').on('change',function(){
  $('.row-chk').prop('checked', this.checked);
  toggleDeleteBtn();
});
// 切換「刪除選取」按鈕狀態
function toggleDeleteBtn(){
  const any=$('.row-chk:checked').length>0;
  $('#delSelBtn').prop('disabled', !any);
}

// ------------ CSV Import / Sort ------------
function importCSV(){
  const f=$('#importFile')[0].files[0];
  if(!f){alert('請選檔');return;}
  const fd=new FormData();fd.append('file',f);
  $.ajax({url:'/admin/import',type:'POST',data:fd,
          contentType:false,processData:false})
    .done(r=>{alert('匯入 '+r.imported+' 筆');loadPage(1);})
    .fail(e=>alert('匯入失敗:'+e.responseJSON?.error));
}

// sort header
$('#dataTable th[data-field]').on('click',function(){
  const f=$(this).data('field');
  if(sort===f){order*=-1;}else{sort=f;order=-1;}
  loadPage(1);
});

$(document).ready(()=>loadPage(1));

function loadDbStatus(){
  $.getJSON('/admin/db_status', res=>{
      $('#dbStatus').text(
        `資料庫已用 ${res.storage_mb} MB / ${res.quota_mb} MB，`+
        `剩餘 ${res.remain_mb} MB ｜ `+
        `Collections: ${res.collections} ｜ Documents: ${res.objects}`
      );
  }).fail(()=>$('#dbStatus').text('無法取得資料庫狀態'));
}

$(document).ready(()=>{
    loadDbStatus();   // ← 先載入 DB 狀態
    loadPage(1);      // ← 再載入資料表
});

</script>
</body>
</html>
